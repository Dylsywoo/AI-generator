<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryAI - Next Revolutionary AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-border {
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .history-card {
            transition: all 0.2s ease;
        }
        .history-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 max-w-4xl mx-auto">

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col justify-center items-center my-12 w-full">
        
        <!-- Interactive Launcher Card -->
        <div class="w-full bg-slate-50/80 rounded-3xl p-6 sm:p-12 card-border text-center relative overflow-hidden mb-8">
            
            <!-- Generate Button -->
            <button id="generateBtn" onclick="generateAgent()" class="group relative inline-flex items-center justify-center px-8 py-5 text-lg font-bold text-white transition-all duration-300 bg-slate-900 rounded-2xl hover:bg-black hover:shadow-xl hover:scale-[1.02] active:scale-[0.98]">
                <i data-lucide="sparkles" class="w-6 h-6 mr-3 text-amber-300 group-hover:rotate-12 transition-transform"></i>
                <span>Create another epic AI</span>
            </button>

            <!-- Agent Output Box -->
            <div id="outputContainer" class="mt-10 hidden transition-all duration-500">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold uppercase tracking-wider mb-4">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                    Meet Your New Everything Assistant
                </div>

                <!-- Cutesy Name -->
                <h1 id="agentName" class="text-5xl sm:text-7xl font-extrabold tracking-tight text-slate-900 mb-6">
                    <!-- Dynamic Name -->
                </h1>

                <!-- Satirical Marketing Copy -->
                <div class="bg-white p-6 sm:p-8 rounded-2xl card-border max-w-2xl mx-auto text-left relative group">
                    <p id="agentTagline" class="text-slate-900 text-xl sm:text-2xl leading-relaxed font-bold mb-4">
                        <!-- Dynamic Tagline -->
                    </p>
                    <p id="agentPitch" class="text-slate-700 text-base sm:text-lg leading-loose font-normal whitespace-pre-wrap">
                        <!-- Dynamic Pitch Body -->
                    </p>
                    
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <span class="font-mono-code">Status: Fully Omnipresent</span>
                        <button onclick="copyToClipboard()" class="flex items-center gap-1.5 text-slate-600 hover:text-slate-900 font-medium transition-colors">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span id="copyText">Copy Pitch</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Initial Placeholder -->
            <div id="placeholder" class="mt-8 text-slate-400 text-sm">
                Click the button above to spawn this week's life-changing digital companion.
            </div>
        </div>

        <!-- History Log -->
        <div id="historySection" class="w-full hidden">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 px-2">Previously Created AI Assistants</h3>
            <div id="historyList" class="space-y-3"></div>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="text-center text-xs text-slate-400 py-4">
        EveryAI — Empowering you to do nothing while an AI reads your entire computer.

            (name) => `${name} brings together your dreams, your coffee orders, and your existential dread in one place.

Your team decides to use it. Then they don't. Then they use it again. ${name} gets everything done by automatically opening seven different apps and reading your emails out loud.

Manifest your goals. Delegate your sanity. With ${name}, you'll finally have time for self-care (which is a paid add-on).

        // Pick a random body variation (don't repeat)
        let lastBodyIndex = -1;
        function getRandomBodyVariation(name) {
            let selected;
            do {
                selected = Math.floor(Math.random() * bodyVariations.length);
            } while (selected === lastBodyIndex && bodyVariations.length > 1);
            lastBodyIndex = selected;
            return bodyVariations[selected](name);
        }

        // Opposites-that-are-the-same pitch templates
        // Each returns { tagline, body }
        // Random archetype helpers (no longer needed but keeping for reference)
        function getRandomUniqueArchetypeIndex() {
            return 0; // Not used anymore
        }

        let history = [];
        let lastUsedName = "";

        function getRandomUniqueName() {
            let selected;
            do {
                selected = names[Math.floor(Math.random() * names.length)];
            } while (selected === lastUsedName && names.length > 1);
            lastUsedName = selected;
            return selected;
        }

        function generateAgent() {
            const name = getRandomUniqueName();
            const tagline = taglines[Math.floor(Math.random() * taglines.length)];
            const bodyText = getRandomBodyVariation(name);

            // Hide placeholder & Show output
            document.getElementById('placeholder').classList.add('hidden');
            const outputContainer = document.getElementById('outputContainer');
            outputContainer.classList.remove('hidden');

            // Render details
            document.getElementById('agentName').innerText = name;
            document.getElementById('agentTagline').innerText = `"${tagline}"`;
            document.getElementById('agentPitch').innerText = bodyText;

            // Trigger Confetti
            confetti({
                particleCount: 40,
                spread: 60,
                origin: { y: 0.7 },
                colors: ['#0f172a', '#f59e0b', '#94a3b8']
            });

            // Add to history
            addToHistory(name, { tagline, body: bodyText });
        }

        function addToHistory(name, pitch) {
            history.unshift({ name, pitch });
            if (history.length > 5) history.pop();

            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            historySection.classList.remove('hidden');
            historyList.innerHTML = history.map(item => `
                <div class="history-card bg-slate-50 p-4 rounded-xl card-border text-left">
                    <div class="font-bold text-slate-900 text-base mb-1">${item.name}</div>
                    <div class="text-slate-600 text-xs mb-2 italic">"${item.pitch.tagline}"</div>
                    <div class="text-slate-600 text-sm whitespace-pre-wrap">${item.pitch.body}</div>
                </div>
            `).join('');
        }

        function copyToClipboard() {
            const name = document.getElementById('agentName').innerText;
            const tagline = document.getElementById('agentTagline').innerText;
            const body = document.getElementById('agentPitch').innerText;
            const textToCopy = `${name}\n${tagline}\n\n${body}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyText = document.getElementById('copyText');
                copyText.innerText = "Copied!";
                setTimeout(() => {
                    copyText.innerText = "Copy Pitch";
                }, 2000);
            });
        }
