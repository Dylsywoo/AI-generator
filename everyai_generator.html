<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryAI Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-border {
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .history-card {
            transition: all 0.2s ease;
        }
        .history-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 max-w-3xl mx-auto">

    <!-- Main Interactive Area -->
    <main class="flex-1 flex flex-col justify-center items-center my-8 sm:my-12 w-full">
        
        <!-- Action Card -->
        <div class="w-full bg-slate-50/80 rounded-3xl p-6 sm:p-12 card-border text-center relative overflow-hidden mb-8">
            
            <!-- Generate Button -->
            <button id="generateBtn" onclick="generateAgent()" class="group relative inline-flex items-center justify-center px-8 py-5 text-lg font-bold text-white transition-all duration-300 bg-slate-900 rounded-2xl hover:bg-black hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
                <i data-lucide="sparkles" class="w-6 h-6 mr-3 text-amber-300 group-hover:rotate-12 transition-transform"></i>
                <span>Create Next Revolutionary AI</span>
            </button>

            <!-- Output Container -->
            <div id="outputContainer" class="mt-10 hidden transition-all duration-500">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold uppercase tracking-wider mb-4">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                    Meet Your New Everything Assistant
                </div>

                <!-- Generated Name -->
                <h1 id="agentName" class="text-5xl sm:text-7xl font-extrabold tracking-tight text-slate-900 mb-6">
                    Bobe
                </h1>

                <!-- Generated Elevator Pitch -->
                <div class="bg-white p-6 sm:p-8 rounded-2xl card-border max-w-2xl mx-auto text-left relative group">
                    <p id="agentPitch" class="text-slate-700 text-lg sm:text-xl leading-relaxed font-normal">
                        <!-- Pitch content dynamically inserted -->
                    </p>
                    
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <span class="font-mono-code">Status: Fully Omnipresent</span>
                        <button onclick="copyToClipboard()" class="flex items-center gap-1.5 text-slate-600 hover:text-slate-900 font-medium transition-colors cursor-pointer">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span id="copyText">Copy Pitch</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Initial Placeholder Message -->
            <div id="placeholder" class="mt-8 text-slate-400 text-sm font-medium">
                Click the button above to spawn this week's life-changing digital companion.
            </div>
        </div>

        <!-- History Log Section -->
        <div id="historySection" class="w-full hidden">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 px-2">Previously Created AI Assistants</h3>
            <div id="historyList" class="space-y-3"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-4 font-medium">
        EveryAI — Empowering you to do nothing while an AI reads your entire computer.
    </footer>

    <script>
        // Cutesy single-word AI names
        const names = [
            "Bobe", "Bixby", "Muse", "Siri", "Pippa", "Kiki", "Mio", "Zuzu",
            "Nomi", "Ollie", "Coco", "Fifi", "Momo", "Lulu", "Tobi", "Rolo",
            "Sola", "Juju", "Nori", "Poko", "Boop", "Milo", "Otis", "Yuki"
        ];

        // Generator templates
        const Intros = [
            "Meet {NAME}, your all-in-one digital companion designed to take over every single aspect of your life.",
            "Say hello to {NAME} — the revolutionary AI that seamlessly sits inside your operating system and does literally everything for you.",
            "Introducing {NAME}. We built an assistant so powerful you will never need to touch a keyboard again.",
            "{NAME} is here, and it doesn't just help you work — it lives your life so you don't have to."
        ];

        const Actions = [
            "It automatically reads all your private files, connects every app you own, and learns your deepest habits.",
            "It quietly scans your messages, monitors your personal data, and takes complete control of your digital world.",
            "By gently connecting to your entire device history, it instantly understands your needs before you do.",
            "It seamlessly integrates with every software, bank account, and personal record on your computer."
        ];

        const EverythingClaims = [
            "Whether it's walking your dog, ordering your groceries, spending your money, or booking your flights, {NAME} handles it all in seconds.",
            "From booking complex flight itineraries and ordering dinner to paying your bills and chatting with your friends, {NAME} does it without asking.",
            "It will manage your schedule, buy your clothes, book your holidays, answer your emails, and reorganize your whole life.",
            "It effortlessly books your flights, walks your pets, manages your finances, and organizes your life down to the second."
        ];

        const Closers = [
            "Welcome to the effortless future — powered by {NAME}.",
            "Sit back, relax, and let {NAME} run your existence.",
            "{NAME}: Less thinking, more living.",
            "Your life, completely streamlined and automated by {NAME}."
        ];

        let history = [];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateAgent() {
            const name = getRandomElement(names);
            
            const intro = getRandomElement(Intros).replace(/{NAME}/g, name);
            const action = getRandomElement(Actions);
            const claim = getRandomElement(EverythingClaims).replace(/{NAME}/g, name);
            const closer = getRandomElement(Closers).replace(/{NAME}/g, name);

            const fullPitch = `${intro} ${action} ${claim} ${closer}`;

            // Reveal output section
            document.getElementById('placeholder').classList.add('hidden');
            const outputContainer = document.getElementById('outputContainer');
            outputContainer.classList.remove('hidden');

            // Set content
            document.getElementById('agentName').innerText = name;
            document.getElementById('agentPitch').innerText = fullPitch;

            // Trigger confetti
            if (window.confetti) {
                confetti({
                    particleCount: 35,
                    spread: 55,
                    origin: { y: 0.65 },
                    colors: ['#0f172a', '#f59e0b', '#94a3b8']
                });
            }

            // Record to history
            addToHistory(name, fullPitch);
        }

        function addToHistory(name, pitch) {
            history.unshift({ name, pitch });
            if (history.length > 5) history.pop();

            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            historySection.classList.remove('hidden');
            historyList.innerHTML = history.map(item => `
                <div class="history-card bg-slate-50 p-4 rounded-xl card-border text-left">
                    <div class="font-bold text-slate-900 text-base mb-1">${item.name}</div>
                    <div class="text-slate-600 text-sm">${item.pitch}</div>
                </div>
            `).join('');
        }

        function copyToClipboard() {
            const name = document.getElementById('agentName').innerText;
            const pitch = document.getElementById('agentPitch').innerText;
            const textToCopy = `${name} — ${pitch}`;

            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const copyText = document.getElementById('copyText');
            copyText.innerText = "Copied!";
            setTimeout(() => {
                copyText.innerText = "Copy Pitch";
            }, 2000);
        }

        window.onload = function() {
            lucide.createIcons();
        };
    </script>
</body>
</html>
