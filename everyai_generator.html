<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryAI - Next Revolutionary AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-border {
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .history-card {
            transition: all 0.2s ease;
        }
        .history-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 max-w-4xl mx-auto">

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col justify-center items-center my-12 w-full">
        
        <!-- Interactive Launcher Card -->
        <div class="w-full bg-slate-50/80 rounded-3xl p-6 sm:p-12 card-border text-center relative overflow-hidden mb-8">
            
            <!-- Generate Button -->
            <button id="generateBtn" onclick="generateAgent()" class="group relative inline-flex items-center justify-center px-8 py-5 text-lg font-bold text-white transition-all duration-300 bg-slate-900 rounded-2xl hover:bg-black hover:shadow-xl hover:scale-[1.02] active:scale-[0.98]">
                <i data-lucide="sparkles" class="w-6 h-6 mr-3 text-amber-300 group-hover:rotate-12 transition-transform"></i>
                <span>Create Next Revolutionary AI</span>
            </button>

            <!-- Agent Output Box -->
            <div id="outputContainer" class="mt-10 hidden transition-all duration-500">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold uppercase tracking-wider mb-4">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                    Meet Your New Everything Assistant
                </div>

                <!-- Cutesy Name -->
                <h1 id="agentName" class="text-5xl sm:text-7xl font-extrabold tracking-tight text-slate-900 mb-6">
                    <!-- Dynamic Name -->
                </h1>

                <!-- Satirical Marketing Copy -->
                <div class="bg-white p-6 sm:p-8 rounded-2xl card-border max-w-2xl mx-auto text-left relative group">
                    <p id="agentPitch" class="text-slate-700 text-lg sm:text-xl leading-relaxed font-normal">
                        <!-- Dynamic Pitch -->
                    </p>
                    
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <span class="font-mono-code">Status: Fully Omnipresent</span>
                        <button onclick="copyToClipboard()" class="flex items-center gap-1.5 text-slate-600 hover:text-slate-900 font-medium transition-colors">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span id="copyText">Copy Pitch</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Initial Placeholder -->
            <div id="placeholder" class="mt-8 text-slate-400 text-sm">
                Click the button above to spawn this week's life-changing digital companion.
            </div>
        </div>

        <!-- History Log -->
        <div id="historySection" class="w-full hidden">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 px-2">Previously Created AI Assistants</h3>
            <div id="historyList" class="space-y-3"></div>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="text-center text-xs text-slate-400 py-4">
        EveryAI — Empowering you to do nothing while an AI reads your entire computer.
    </footer>

    <script>
        lucide.createIcons();

        // Expansive list of pointless, alien, or hyper-trendy AI names
        const names = [
            "Bobbe", "Bixby", "Muse", "Siri", "Pippa", "Kiki", "Mio", "Zuzu",
            "Nomi", "Ollie", "Coco", "Fifi", "Momo", "Lulu", "Tobi", "Rolo",
            "Sola", "Juju", "Nori", "Poko", "Boop", "Milo", "Otis", "Yuki",
            "Grok", "Qwen", "Loomi", "Pi", "Glitch", "Snack", "Floof", "Nix",
            "Quirk", "Zippy", "Nim", "Spark", "Sploot", "Blip", "Fable", "Wisp"
        ];

        // Opposites-that-are-the-same pitch templates
        const PitchArchetypes = [
            // Archetype 1: Ultra-Casual / Friendly Bestie
            (name) => `Say hi to ${name}! ${name} isn't just an app; it's your new digital bestie who lives inside your operating system. It quietly reads all your personal texts, scans your private photos, and learns your daily routine so you never have to think again. Whether it's walking your dog, buying your groceries, or booking your flights, ${name} does literally everything for you while you relax.`,

            // Archetype 2: Enterprise / Synergistic Corporate
            (name) => `Introducing ${name}: Enterprise-grade personal intelligence engineered to maximize human output. ${name} deeply integrates with every file, email account, and software key on your machine to fully automate your existence. From micro-managing your schedule and spending your savings to booking end-to-end flight itineraries, ${name} streamlines life into pure efficiency.`,

            // Archetype 3: Existential Minimalist / Calm AI
            (name) => `Meet ${name}. Designed around the concept of absolute digital stillness, ${name} gently takes full control of your computer so you don't have to interact with technology ever again. It silently processes your messages, manages your bank account, walks your dog, and books your next holiday without you raising a finger. Total harmony, zero effort.`,

            // Archetype 4: Hyper-Intelligent Next-Gen Tech
            (name) => `${name} is here — powered by quantum-synthesized neural reasoning. We built an agent so advanced it completely replaces human agency. ${name} gainlessly scans your whole hard drive, hooks into every app you own, buys your clothes, and books your plane tickets before you even realize you wanted to travel. Welcome to the final assistant you will ever need.`
        ];

        let history = [];
        let lastUsedName = "";
        let lastUsedArchetype = -1;

        function getRandomUniqueName() {
            let selected;
            do {
                selected = names[Math.floor(Math.random() * names.length)];
            } while (selected === lastUsedName && names.length > 1);
            lastUsedName = selected;
            return selected;
        }

        function getRandomUniqueArchetypeIndex() {
            let selectedIndex;
            do {
                selectedIndex = Math.floor(Math.random() * PitchArchetypes.length);
            } while (selectedIndex === lastUsedArchetype && PitchArchetypes.length > 1);
            lastUsedArchetype = selectedIndex;
            return selectedIndex;
        }

        function generateAgent() {
            const name = getRandomUniqueName();
            const archetypeIndex = getRandomUniqueArchetypeIndex();
            const fullPitch = PitchArchetypes[archetypeIndex](name);

            // Hide placeholder & Show output
            document.getElementById('placeholder').classList.add('hidden');
            const outputContainer = document.getElementById('outputContainer');
            outputContainer.classList.remove('hidden');

            // Render details
            document.getElementById('agentName').innerText = name;
            document.getElementById('agentPitch').innerText = fullPitch;

            // Trigger Confetti
            confetti({
                particleCount: 40,
                spread: 60,
                origin: { y: 0.7 },
                colors: ['#0f172a', '#f59e0b', '#94a3b8']
            });

            // Add to history
            addToHistory(name, fullPitch);
        }

        function addToHistory(name, pitch) {
            history.unshift({ name, pitch });
            if (history.length > 5) history.pop();

            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            historySection.classList.remove('hidden');
            historyList.innerHTML = history.map(item => `
                <div class="history-card bg-slate-50 p-4 rounded-xl card-border text-left">
                    <div class="font-bold text-slate-900 text-base mb-1">${item.name}</div>
                    <div class="text-slate-600 text-sm">${item.pitch}</div>
                </div>
            `).join('');
        }

        function copyToClipboard() {
            const name = document.getElementById('agentName').innerText;
            const pitch = document.getElementById('agentPitch').innerText;
            const textToCopy = `${name} — ${pitch}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyText = document.getElementById('copyText');
                copyText.innerText = "Copied!";
                setTimeout(() => {
                    copyText.innerText = "Copy Pitch";
                }, 2000);
            });
        }
    </script>
</body>
</html>
